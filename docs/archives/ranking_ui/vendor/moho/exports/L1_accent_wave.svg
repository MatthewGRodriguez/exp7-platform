<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 800" width="8" height="800" preserveAspectRatio="none">
  <title>L1 accent wave</title>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      animate, animateTransform, animateMotion { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bb9af7">
        <animate attributeName="offset" values="0;0.2;0" dur="2.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="40%" stop-color="#7dcfff">
        <animate attributeName="stop-color" values="#7dcfff;#bb9af7;#9ece6a;#7dcfff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <rect x="0" y="0" width="4" height="800" fill="url(#rail)" filter="url(#glow)">
    <animate attributeName="y" values="0;-40;0" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="height" values="800;840;800" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="4" height="120" fill="#ffffff" opacity="0.25">
    <animate attributeName="y" values="-120;800" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
