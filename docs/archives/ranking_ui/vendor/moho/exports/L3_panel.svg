<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800" preserveAspectRatio="xMaxYMid meet">
  <title>L3 panel breathe</title>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      animate, animateTransform, animateMotion { display: none; }
    }
  </style>
  <defs>
    <radialGradient id="p" cx="70%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.15;0.4;0.15" dur="5.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g>
    <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="5.5s" repeatCount="indefinite" additive="sum"/>
    <ellipse cx="280" cy="280" rx="160" ry="200" fill="url(#p)"/>
  </g>
</svg>
