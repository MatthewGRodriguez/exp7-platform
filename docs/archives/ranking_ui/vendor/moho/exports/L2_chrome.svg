<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 56" width="1280" height="56" preserveAspectRatio="none">
  <title>L2 chrome breathe</title>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      animate, animateTransform, animateMotion { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.35">
        <animate attributeName="offset" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="56" fill="#0c0a10" opacity="0.35"/>
  <rect y="54" width="1280" height="2" fill="url(#h)"/>
  <text x="20" y="34" fill="#bb9af7" font-family="ui-monospace,monospace" font-size="14" opacity="0.5">❯</text>
  <rect x="1180" y="16" width="60" height="22" rx="4" fill="none" stroke="#bb9af7" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.25;0.7;0.25" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
