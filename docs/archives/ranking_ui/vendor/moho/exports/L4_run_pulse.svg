<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>L4 run pulse</title>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      animate, animateTransform, animateMotion { display: none; }
    }
  </style>
  <circle cx="60" cy="60" r="20" fill="none" stroke="#bb9af7" stroke-width="3" opacity="0.9">
    <animate attributeName="r" values="16;34" dur="0.8s" fill="freeze"/>
    <animate attributeName="opacity" values="0.9;0" dur="0.8s" fill="freeze"/>
  </circle>
  <circle cx="60" cy="60" r="10" fill="#bb9af7" opacity="0.7">
    <animate attributeName="opacity" values="0.9;0.2;0.9;0" dur="0.8s" fill="freeze"/>
  </circle>
  <text x="60" y="64" text-anchor="middle" fill="#e8e8e8" font-family="ui-monospace,monospace" font-size="10" opacity="0.8">run()</text>
</svg>
