<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" preserveAspectRatio="xMidYMid slice">
  <title>L0 void ambient</title>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      animate, animateTransform, animateMotion { display: none; }
    }
  </style>
  <defs>
    <radialGradient id="v1" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.14">
        <animate attributeName="stop-opacity" values="0.08;0.18;0.08" dur="8s" repeatCount="indefinite"/>
