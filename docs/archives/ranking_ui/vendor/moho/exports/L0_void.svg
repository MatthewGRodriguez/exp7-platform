  <rect width="1280" height="800" fill="url(#v2)"/>
  <g opacity="0.12">
    <circle cx="200" cy="200" r="2" fill="#bb9af7">
      <animate attributeName="cy" values="200;180;200" dur="6s" repeatCount="indefinite"/>
