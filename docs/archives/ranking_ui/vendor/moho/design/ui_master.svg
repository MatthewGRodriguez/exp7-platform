<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <title>JWorkbook Moho UI master (animated densest)</title>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      animate, animateTransform, animateMotion { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="accentG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="50%" stop-color="#7dcfff">
        <animate attributeName="stop-color" values="#7dcfff;#9ece6a;#bb9af7;#7dcfff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <radialGradient id="voidG" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.12">
        <animate attributeName="stop-opacity" values="0.06;0.16;0.06" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="800" fill="#050508"/>
  <rect width="1280" height="800" fill="url(#voidG)"/>
  <rect x="0" y="0" width="4" height="800" fill="url(#accentG)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="1280" height="52" fill="#0c0a10" opacity="0.95"/>
  <text x="24" y="32" fill="#9ece6a" font-family="ui-monospace,monospace" font-size="14">❯</text>
  <text x="42" y="32" fill="#bb9af7" font-family="ui-monospace,monospace" font-size="16" font-weight="700">JWorkbook</text>
  <text x="160" y="32" fill="#6a6474" font-family="ui-monospace,monospace" font-size="11">SVG-first densest motion · living-core</text>
  <rect x="0" y="52" width="1280" height="36" fill="#0a0810"/>
  <text x="100" y="74" fill="#bb9af7" font-family="ui-monospace,monospace" font-size="10">REVIEW</text>
  <rect x="96" y="84" width="52" height="2" fill="#bb9af7">
    <animate attributeName="width" values="40;60;40" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="12" y="128" width="900" height="656" rx="8" fill="#0e0c12" stroke="#2a2433"/>
  <rect x="12" y="128" width="4" height="656" fill="#bb9af7" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="928" y="128" width="340" height="656" rx="8" fill="#0e0c12" stroke="#2a2433"/>
  <ellipse cx="1100" cy="320" rx="120" ry="160" fill="#bb9af7" opacity="0.08">
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <text x="24" y="788" fill="#4a4454" font-family="ui-monospace,monospace" font-size="10">living-core SVG-first · SMIL densest · Moho can replace exports later</text>
</svg>
