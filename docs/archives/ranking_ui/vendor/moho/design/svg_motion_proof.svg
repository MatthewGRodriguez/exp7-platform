<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <title>living-core · SVG-first motion proof</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#121018"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="50%" stop-color="#7dcfff">
        <animate attributeName="stop-color" values="#7dcfff;#9ece6a;#bb9af7;#7dcfff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="540" fill="url(#rail)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="64" fill="#bb9af7" font-family="ui-monospace,monospace" font-size="28" font-weight="700">JWorkbook · SVG-first</text>
  <text x="40" y="96" fill="#6a6474" font-family="ui-monospace,monospace" font-size="14">living-core densest · roadmap go</text>
  <g font-family="ui-monospace,monospace" font-size="13" fill="#c8c4d0">
    <text x="40" y="160">Phase 0 foundation ✅</text>
    <text x="40" y="188">Phase 1 densest SVG assets ✅ (Moho art optional upgrade)</text>
    <text x="40" y="216">Phase 2 event wiring ✅</text>
    <text x="40" y="244">Phase 4 motion under REVIEW ✅ (catalog hash)</text>
    <text x="40" y="272" fill="#7dcfff">Phase 3 graduate Moho probe → next samples</text>
    <text x="40" y="300" fill="#6a6474">Phase 5 calendar modalities → later</text>
  </g>
  <g transform="translate(640 180)">
    <circle r="36" fill="none" stroke="#bb9af7" stroke-width="3">
      <animate attributeName="r" values="28;42;28" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M-14 2 L-2 14 L18 -12" fill="none" stroke="#9ece6a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="40" y="500" fill="#4a4454" font-family="ui-monospace,monospace" font-size="11">store/exports/living_svg_motion_proof.svg · always animate · HTML SoT</text>
</svg>
