<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <title>Exp7 pose drawings. The state machine shows one. This file shows all eight.</title>
  <desc>Trial drawing for the 2026-11-08 direction. Contact shadows are Gaussian blurs in the SVG. The state machine selects a pose with data-sm on the root (idle, hover, focus, pressed, selected, dragging, drop-pending, invalid). With no data-sm, the contact sheet is visible. This is a free-control button. A calendar day uses the same drawings and does not move or grow. Not Moho output. Not wired into the lean shell.</desc>
  <style>
    .pose { display: none; }
    svg:not([data-sm]) .sheet { display: inline; }
    svg:not([data-sm]) .live { display: none; }
    svg[data-sm] .sheet { display: none; }
    svg[data-sm] .live { display: inline; }
    svg[data-sm="idle"] .pose-idle,
    svg[data-sm="hover"] .pose-hover,
    svg[data-sm="focus"] .pose-focus,
    svg[data-sm="pressed"] .pose-pressed,
    svg[data-sm="selected"] .pose-selected,
    svg[data-sm="dragging"] .pose-dragging,
    svg[data-sm="drop-pending"] .pose-drop,
    svg[data-sm="invalid"] .pose-invalid { display: inline; }
  </style>
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="wide" x="-70%" y="-70%" width="240%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="55%" stop-color="#1c2333" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1c2333" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <rect width="980" height="520" fill="#e7e4de"/>
  <text x="32" y="36" fill="#1c2333" font-family="ui-sans-serif, sans-serif" font-size="18" font-weight="700">Pose drawings. One light. The state machine picks one.</text>
  <text x="32" y="58" fill="#4a5160" font-family="ui-sans-serif, sans-serif" font-size="13">Free control. A day uses these drawings and stays put. Set data-sm to show a single pose.</text>

  <g class="sheet" font-family="ui-sans-serif, sans-serif">
    <!-- idle -->
    <g transform="translate(32 86)">
      <g filter="url(#soft)"><rect x="18" y="36" width="148" height="78" rx="12" fill="#141e32" fill-opacity="0.58"/></g>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="#f7f5f1"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      <text x="16" y="128" fill="#1c2333" font-size="13" font-weight="650">idle</text>
    </g>
    <!-- hover: face up 2px, tighter shadow -->
    <g transform="translate(262 86)">
      <g filter="url(#soft)"><rect x="22" y="38" width="136" height="70" rx="12" fill="#141e32" fill-opacity="0.5"/></g>
      <g transform="translate(0 -2)">
        <rect x="16" y="28" width="148" height="78" rx="12" fill="#f7f5f1"/>
        <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
        <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      </g>
      <text x="16" y="128" fill="#1c2333" font-size="13" font-weight="650">hover</text>
    </g>
    <!-- focus -->
    <g transform="translate(492 86)">
      <g filter="url(#soft)"><rect x="18" y="36" width="148" height="78" rx="12" fill="#141e32" fill-opacity="0.58"/></g>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="#f7f5f1"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      <rect x="14" y="26" width="152" height="82" rx="14" fill="none" stroke="#2458a6" stroke-width="2"/>
      <text x="16" y="128" fill="#1c2333" font-size="13" font-weight="650">focus</text>
    </g>
    <!-- pressed -->
    <g transform="translate(722 86)">
      <g filter="url(#soft)"><rect x="24" y="40" width="132" height="66" rx="11" fill="#141e32" fill-opacity="0.55"/></g>
      <g transform="translate(90 67) scale(0.97) translate(-90 -67)">
        <rect x="16" y="28" width="148" height="78" rx="12" fill="#efeae2"/>
        <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
        <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
        <rect x="14" y="26" width="152" height="82" rx="14" fill="none" stroke="#2458a6" stroke-width="2"/>
      </g>
      <text x="16" y="128" fill="#1c2333" font-size="13" font-weight="650">pressed</text>
    </g>
    <!-- selected -->
    <g transform="translate(32 292)">
      <g filter="url(#soft)"><rect x="20" y="40" width="140" height="72" rx="12" fill="#141e32" fill-opacity="0.48"/></g>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="#f3ead4"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      <rect x="13" y="25" width="154" height="84" rx="14" fill="none" stroke="#75510f" stroke-width="2.5"/>
      <text x="16" y="128" fill="#1c2333" font-size="13" font-weight="650">selected</text>
    </g>
    <!-- dragging -->
    <g transform="translate(262 292)">
      <g filter="url(#wide)"><rect x="10" y="48" width="160" height="78" rx="16" fill="#141e32" fill-opacity="0.38"/></g>
      <g transform="translate(0 -6)">
        <rect x="16" y="28" width="148" height="78" rx="12" fill="#f7f5f1"/>
        <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
        <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      </g>
      <text x="16" y="128" fill="#1c2333" font-size="13" font-weight="650">dragging</text>
    </g>
    <!-- drop-pending -->
    <g transform="translate(492 292)">
      <g filter="url(#soft)"><rect x="18" y="36" width="148" height="78" rx="12" fill="#141e32" fill-opacity="0.58"/></g>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="#f6f0e2"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      <rect x="13" y="25" width="154" height="84" rx="14" fill="none" stroke="#75510f" stroke-width="2.5"/>
      <text x="16" y="128" fill="#1c2333" font-size="13" font-weight="650">drop-pending</text>
    </g>
    <!-- invalid -->
    <g transform="translate(722 292)">
      <g filter="url(#soft)"><rect x="18" y="36" width="148" height="78" rx="12" fill="#141e32" fill-opacity="0.58"/></g>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="#f7f5f1"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      <rect x="13" y="25" width="154" height="84" rx="14" fill="none" stroke="#aa0000" stroke-width="2.5"/>
      <text x="16" y="128" fill="#1c2333" font-size="13" font-weight="650">invalid</text>
    </g>
  </g>

  <g class="live">
    <g class="pose pose-idle" transform="translate(400 160)">
      <g filter="url(#soft)"><rect x="18" y="36" width="148" height="78" rx="12" fill="#141e32" fill-opacity="0.58"/></g>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="#f7f5f1"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
    </g>
    <g class="pose pose-hover" transform="translate(400 160)">
      <g filter="url(#soft)"><rect x="22" y="38" width="136" height="70" rx="12" fill="#141e32" fill-opacity="0.5"/></g>
      <g transform="translate(0 -2)">
        <rect x="16" y="28" width="148" height="78" rx="12" fill="#f7f5f1"/>
        <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
        <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      </g>
    </g>
    <g class="pose pose-focus" transform="translate(400 160)">
      <g filter="url(#soft)"><rect x="18" y="36" width="148" height="78" rx="12" fill="#141e32" fill-opacity="0.58"/></g>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="#f7f5f1"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      <rect x="14" y="26" width="152" height="82" rx="14" fill="none" stroke="#2458a6" stroke-width="2"/>
    </g>
    <g class="pose pose-pressed" transform="translate(400 160)">
      <g filter="url(#soft)"><rect x="24" y="40" width="132" height="66" rx="11" fill="#141e32" fill-opacity="0.55"/></g>
      <g transform="translate(90 67) scale(0.97) translate(-90 -67)">
        <rect x="16" y="28" width="148" height="78" rx="12" fill="#efeae2"/>
        <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
        <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
        <rect x="14" y="26" width="152" height="82" rx="14" fill="none" stroke="#2458a6" stroke-width="2"/>
      </g>
    </g>
    <g class="pose pose-selected" transform="translate(400 160)">
      <g filter="url(#soft)"><rect x="20" y="40" width="140" height="72" rx="12" fill="#141e32" fill-opacity="0.48"/></g>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="#f3ead4"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      <rect x="13" y="25" width="154" height="84" rx="14" fill="none" stroke="#75510f" stroke-width="2.5"/>
    </g>
    <g class="pose pose-dragging" transform="translate(400 160)">
      <g filter="url(#wide)"><rect x="10" y="48" width="160" height="78" rx="16" fill="#141e32" fill-opacity="0.38"/></g>
      <g transform="translate(0 -6)">
        <rect x="16" y="28" width="148" height="78" rx="12" fill="#f7f5f1"/>
        <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
        <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      </g>
    </g>
    <g class="pose pose-drop" transform="translate(400 160)">
      <g filter="url(#soft)"><rect x="18" y="36" width="148" height="78" rx="12" fill="#141e32" fill-opacity="0.58"/></g>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="#f6f0e2"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      <rect x="13" y="25" width="154" height="84" rx="14" fill="none" stroke="#75510f" stroke-width="2.5"/>
    </g>
    <g class="pose pose-invalid" transform="translate(400 160)">
      <g filter="url(#soft)"><rect x="18" y="36" width="148" height="78" rx="12" fill="#141e32" fill-opacity="0.58"/></g>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="#f7f5f1"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#top)"/>
      <rect x="16" y="28" width="148" height="78" rx="12" fill="url(#lip)"/>
      <rect x="13" y="25" width="154" height="84" rx="14" fill="none" stroke="#aa0000" stroke-width="2.5"/>
    </g>
  </g>

  <g transform="translate(760 448)">
    <rect x="0" y="0" width="188" height="36" rx="8" fill="#1c2333"/>
    <rect x="0" y="0" width="188" height="36" rx="8" fill="url(#glass)"/>
    <text x="12" y="23" fill="#f7f5f1" font-family="ui-sans-serif, sans-serif" font-size="12">dark glass, static</text>
  </g>
  <text x="32" y="472" fill="#4a5160" font-family="ui-sans-serif, sans-serif" font-size="12">Trial sheet, Chrome, 2026-11-08. Affinity and Moho on the Mac draw the real set.</text>
</svg>
