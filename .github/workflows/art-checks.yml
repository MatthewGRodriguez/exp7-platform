name: art-checks
on:
  push:
    branches: ["cursor/art-ux-profile-image-*", "main"]
  pull_request:
    branches: ["main"]

jobs:
  node-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JRDI unit tests
        run: node tests/jrender-images.test.mjs
      - name: JRDI lifecycle tests
        run: node tests/jrender-images-lifecycle.test.mjs
      - name: Universal UX regression
        run: node tests/jrviews-ux-regression.test.mjs
      - name: Perspective VP tests
        run: node art/perspective/perspective-tests.mjs
      - name: Blender generator dry-run
        run: python3 art/pipeline/blender/generate_ui_scene.py --dry-run --params art/design/params.json --states art/design/state-table.json
      - name: Contact sheets
        run: python3 art/pipeline/make_contact_sheets.py
      - name: Assert no second renderer markers
        run: |
          if grep -RInE 'WebGL2|webgl2|css-renderer|dom-renderer|fallback renderer' art/src; then exit 1; fi
          grep -nE 'No second renderer|shared GPUContext' art/src/jrender-images.js
      - name: Assert Moho seed is real zip
        run: |
          file art/pipeline/moho/seed/JWorkbook_chrome.moho | grep -iE 'zip|archive'
          unzip -l art/pipeline/moho/seed/JWorkbook_chrome.moho | grep Project.mohoproj
